name: One-shot formatting for Shopify draft integration branch
on:
  push:
    branches:
      - agent/shopify-draft-order-supabase-safe-20261010
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-draft-order-supabase-safe-20261010
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Replace unsafe test assertions with concrete type
        run: |
          node -e 'const fs=require("node:fs");const p="tests/unit/shopify-whatsapp-draft.test.ts";let s=fs.readFileSync(p,"utf8");s="import type { CreateOrderResult } from \"@/lib/order.functions\";\n"+s.replaceAll(" as any", " as unknown as CreateOrderResult");fs.writeFileSync(p,s)'
      - name: Format only branch-specific source and tests
        run: npx prettier --write src/lib/shopify/whatsapp-draft.server.ts src/routes/api/shopify-orders.ts tests/unit/shopify-orders-cors.test.ts tests/unit/shopify-whatsapp-draft.test.ts
      - name: Commit reviewed formatting to branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/shopify/whatsapp-draft.server.ts src/routes/api/shopify-orders.ts tests/unit/shopify-orders-cors.test.ts tests/unit/shopify-whatsapp-draft.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Shopify order bridge and typed tests [format-done]'
            git push origin HEAD:agent/shopify-draft-order-supabase-safe-20261010
          fi
