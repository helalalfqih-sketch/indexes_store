name: Temporary formatter for draft bridge review
on:
  push:
    branches: [agent/shopify-draft-order-supabase-safe-20261010]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-draft-order-supabase-safe-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only proposed Shopify bridge TypeScript
        run: |
          npx prettier --write src/lib/shopify/whatsapp-draft.server.ts src/routes/api/shopify-orders.ts tests/unit/shopify-orders-handler.test.ts
      - name: Commit branch-only formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/shopify/whatsapp-draft.server.ts src/routes/api/shopify-orders.ts tests/unit/shopify-orders-handler.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize reviewed Shopify bridge code [formatted]'
            git push origin HEAD:agent/shopify-draft-order-supabase-safe-20261010
          fi
