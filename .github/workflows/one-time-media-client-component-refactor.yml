name: One-time media client component refactor

on:
  push:
    branches:
      - audit/full-platform-functional-responsive-review
    paths:
      - .github/workflows/one-time-media-client-component-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-platform-functional-responsive-review
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract upload logic into client-boundary component
        shell: python
        run: |
          from pathlib import Path
          import re

          route_path = Path("src/routes/admin.media.tsx")
          route = route_path.read_text(encoding="utf-8")

          route = route.replace(
              'import { useRef, useState, type MouseEvent as ReactMouseEvent } from "react";',
              'import { useState, type MouseEvent as ReactMouseEvent } from "react";'
          )
          route = route.replace('  CheckCircle2,\n', '')
          route = route.replace('  RefreshCw,\n', '')
          route = route.replace('  Upload,\n', '')
          route = route.replace('  XCircle,\n', '')
          route = route.replace('  validateMediaFile,\n', '')
          route = re.sub(
              r'import \{\n  cleanupMediaUploadFn,\n  finalizeMediaUploadFn,\n  prepareMediaUploadFn,\n\} from "@/lib/media-upload\.functions";\n',
              '',
              route,
          )
          route = route.replace(
              'import { toast } from "sonner";\n',
              'import { toast } from "sonner";\nimport { MediaUploadPanel } from "@/components/admin/media-upload-panel";\n'
          )
          route = re.sub(
              r'type UploadStatus = .*?\n\nfunction MediaPreview',
              'function MediaPreview',
              route,
              flags=re.S,
          )
          route = re.sub(
              r'\n  const prepareUploadFn = useServerFn\(prepareMediaUploadFn\);\n  const finalizeUploadFn = useServerFn\(finalizeMediaUploadFn\);\n  const cleanupUploadFn = useServerFn\(cleanupMediaUploadFn\);',
              '',
              route,
          )
          route = re.sub(
              r'\n  const fileInputRef = useRef<HTMLInputElement \| null>\(null\);\n  const uploadControllersRef = useRef\(new Map<string, AbortController>\(\)\);',
              '',
              route,
          )
          route = re.sub(
              r'\n  const \[uploadQueue, setUploadQueue\] = useState<UploadQueueItem\[\]>\(\[\]\);\n\n  const updateUploadItem = .*?\n  \};',
              '',
              route,
              flags=re.S,
          )
          route = re.sub(
              r'\n  const uploadOne = async \(item: UploadQueueItem\) => \{.*?\n  const handleCopyUrl',
              '\n  const handleCopyUrl',
              route,
              flags=re.S,
          )
          route = re.sub(
              r'\n  const activeUploads = .*?;\n',
              '\n',
              route,
          )
          route = re.sub(
              r'\n          <button\n            type="button"\n            onClick=\{\(\) => fileInputRef\.current\?\.click\(\)\}.*?\n          </button>',
              '',
              route,
              flags=re.S,
          )
          route = re.sub(
              r'\n          <input\n            ref=\{fileInputRef\}.*?\n          />',
              '',
              route,
              flags=re.S,
          )
          route = re.sub(
              r'\n      <section\n        onDragOver=.*?\n      \{uploadQueue\.length > 0 && \(.*?\n      \)\}\n',
              '\n      <MediaUploadPanel />\n',
              route,
              flags=re.S,
          )

          if 'media-upload.client' in route or 'media-upload.functions' in route:
              raise SystemExit('Route still contains forbidden upload imports')
          if 'MediaUploadPanel' not in route:
              raise SystemExit('MediaUploadPanel was not inserted')

          component_path = Path("src/components/admin/media-upload-panel.tsx")
          component_path.parent.mkdir(parents=True, exist_ok=True)
          component_path.write_text(r'''import { useRef, useState } from "react";
import { useQueryClient } from "@tanstack/react-query";
import { createClientOnlyFn, useServerFn } from "@tanstack/react-start";
import { CheckCircle2, Loader2, RefreshCw, Trash2, Upload, X, XCircle } from "lucide-react";
import { toast } from "sonner";
import { validateMediaFile } from "@/lib/media.functions";
import {
  cleanupMediaUploadFn,
  finalizeMediaUploadFn,
  prepareMediaUploadFn,
} from "@/lib/media-upload.functions";

type UploadStatus = "queued" | "preparing" | "uploading" | "finalizing" | "done" | "error" | "cancelled";

type UploadQueueItem = {
  id: string;
  file: File;
  progress: number;
  status: UploadStatus;
  error?: string;
};

type DirectUploadOptions = {
  bucket: string;
  path: string;
  file: File;
  signal?: AbortSignal;
  maxAttempts?: number;
  onProgress?: (percent: number) => void;
};

const uploadMediaDirectClient = createClientOnlyFn(async (options: DirectUploadOptions) => {
  const { uploadMediaDirect } = await import("@/lib/media-upload.client");
  return uploadMediaDirect(options);
});

function formatBytes(bytes: number): string {
  if (!Number.isFinite(bytes) || bytes <= 0) return "0 MB";
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function statusLabel(status: UploadStatus): string {
  switch (status) {
    case "queued":
      return "في قائمة الانتظار";
    case "preparing":
      return "جارٍ تجهيز المسار الآمن";
    case "uploading":
      return "جارٍ الرفع إلى Storage";
    case "finalizing":
      return "جارٍ تسجيل بيانات الملف";
    case "done":
      return "اكتمل الرفع";
    case "cancelled":
      return "تم إلغاء الرفع";
    default:
      return "فشل الرفع";
  }
}

export function MediaUploadPanel() {
  const queryClient = useQueryClient();
  const prepareUploadFn = useServerFn(prepareMediaUploadFn);
  const finalizeUploadFn = useServerFn(finalizeMediaUploadFn);
  const cleanupUploadFn = useServerFn(cleanupMediaUploadFn);
  const fileInputRef = useRef<HTMLInputElement | null>(null);
  const uploadControllersRef = useRef(new Map<string, AbortController>());
  const [uploadQueue, setUploadQueue] = useState<UploadQueueItem[]>([]);

  const updateUploadItem = (id: string, patch: Partial<UploadQueueItem>) => {
    setUploadQueue((current) => current.map((item) => (item.id === id ? { ...item, ...patch } : item)));
  };

  const uploadOne = async (item: UploadQueueItem) => {
    const validation = validateMediaFile(item.file);
    if (!validation.valid) {
      updateUploadItem(item.id, { status: "error", error: validation.error, progress: 0 });
      toast.error(`${item.file.name}: ${validation.error}`);
      return;
    }

    let prepared: { bucket: string; path: string; fileType: "image" | "video" } | null = null;
    let uploadCompleted = false;
    let finalizeStarted = false;
    const controller = new AbortController();
    uploadControllersRef.current.set(item.id, controller);

    try {
      updateUploadItem(item.id, { status: "preparing", error: undefined, progress: 0 });
      prepared = await prepareUploadFn({
        data: {
          fileName: item.file.name,
          sizeBytes: item.file.size,
          mimeType: item.file.type,
        },
      });

      updateUploadItem(item.id, { status: "uploading", progress: 0 });
      await uploadMediaDirectClient({
        bucket: prepared.bucket,
        path: prepared.path,
        file: item.file,
        signal: controller.signal,
        maxAttempts: 3,
        onProgress: (progress) => updateUploadItem(item.id, { status: "uploading", progress }),
      });
      uploadCompleted = true;

      updateUploadItem(item.id, { status: "finalizing", progress: 100 });
      finalizeStarted = true;
      await finalizeUploadFn({
        data: {
          bucket: prepared.bucket,
          path: prepared.path,
          fileName: item.file.name,
          sizeBytes: item.file.size,
          mimeType: item.file.type,
          metadata: { source: "upload" },
        },
      });

      updateUploadItem(item.id, { status: "done", progress: 100, error: undefined });
      toast.success(`تم رفع ${item.file.name} وتسجيله بنجاح`);
      await queryClient.invalidateQueries({ queryKey: ["admin-media-files"] });
    } catch (error) {
      const uploadError = error instanceof Error ? error : new Error("فشل رفع الملف");
      const cancelled = uploadError.name === "AbortError" || controller.signal.aborted;
      updateUploadItem(item.id, {
        status: cancelled ? "cancelled" : "error",
        error: cancelled ? "تم إلغاء الرفع" : uploadError.message,
      });

      if (prepared && uploadCompleted && !finalizeStarted) {
        try {
          await cleanupUploadFn({ data: { bucket: prepared.bucket, path: prepared.path } });
        } catch (cleanupError) {
          console.error("[MEDIA_UPLOAD_CLIENT_CLEANUP_FAILED]", cleanupError);
        }
      }
      if (!cancelled) toast.error(`${item.file.name}: ${uploadError.message}`);
    } finally {
      uploadControllersRef.current.delete(item.id);
    }
  };

  const handleFileUpload = async (files: File[]) => {
    const entries = files.map<UploadQueueItem>((file) => ({
      id: crypto.randomUUID(),
      file,
      progress: 0,
      status: "queued",
    }));
    if (!entries.length) return;

    setUploadQueue((current) => [...entries, ...current]);
    for (const entry of entries) await uploadOne(entry);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const cancelUpload = (id: string) => uploadControllersRef.current.get(id)?.abort();

  const retryUpload = (id: string) => {
    const item = uploadQueue.find((entry) => entry.id === id);
    if (item) void uploadOne({ ...item, status: "queued", progress: 0, error: undefined });
  };

  const activeUploads = uploadQueue.filter((item) => !["done", "error", "cancelled"].includes(item.status)).length;

  return (
    <div className="space-y-3">
      <div className="flex justify-end">
        <button
          type="button"
          onClick={() => fileInputRef.current?.click()}
          disabled={activeUploads > 0}
          className="inline-flex items-center gap-2 rounded-2xl bg-primary px-4 py-2 text-xs font-bold text-primary-foreground shadow-md disabled:opacity-60"
        >
          {activeUploads ? <Loader2 className="h-4 w-4 animate-spin" /> : <Upload className="h-4 w-4" />}
          {activeUploads ? `جارٍ رفع ${activeUploads}` : "رفع وسائط جديدة"}
        </button>
        <input
          ref={fileInputRef}
          type="file"
          multiple
          accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml,video/mp4,video/webm"
          className="hidden"
          onChange={(event) => void handleFileUpload(Array.from(event.target.files || []))}
        />
      </div>

      <section
        onDragOver={(event) => event.preventDefault()}
        onDrop={(event) => {
          event.preventDefault();
          void handleFileUpload(Array.from(event.dataTransfer.files || []));
        }}
        onClick={() => fileInputRef.current?.click()}
        className="group cursor-pointer rounded-3xl border-2 border-dashed border-border/80 bg-surface/40 p-5 text-center transition hover:border-primary/60 hover:bg-primary/5"
      >
        <Upload className="mx-auto h-8 w-8 text-primary transition-transform group-hover:scale-110" />
        <p className="mt-2 text-xs font-bold">اسحب الصور أو الفيديوهات هنا، أو انقر للاختيار من الهاتف أو الكمبيوتر</p>
        <p className="mt-1 text-[11px] text-muted-foreground">JPG, PNG, WebP, GIF, SVG حتى 10MB — MP4, WebM حتى 50MB</p>
      </section>

      {uploadQueue.length > 0 && (
        <section className="space-y-3 rounded-3xl border border-border bg-surface p-4 shadow-sm" aria-live="polite">
          <div className="flex items-center justify-between gap-3">
            <div>
              <h2 className="text-sm font-black">حالة الرفع</h2>
              <p className="text-[11px] text-muted-foreground">الرفع المباشر يعيد المحاولة تلقائياً حتى 3 مرات للأخطاء المؤقتة.</p>
            </div>
            <button
              type="button"
              onClick={() => setUploadQueue((current) => current.filter((item) => !["done", "cancelled"].includes(item.status)))}
              className="rounded-xl border border-border px-3 py-1.5 text-[11px] font-bold"
            >
              تنظيف المكتمل
            </button>
          </div>

          <div className="space-y-2">
            {uploadQueue.map((item) => (
              <div key={item.id} className="rounded-2xl border border-border/70 bg-background p-3">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2">
                      {item.status === "done" ? <CheckCircle2 className="h-4 w-4 shrink-0 text-emerald-500" /> : item.status === "error" || item.status === "cancelled" ? <XCircle className="h-4 w-4 shrink-0 text-destructive" /> : <Loader2 className="h-4 w-4 shrink-0 animate-spin text-primary" />}
                      <p className="truncate text-xs font-bold">{item.file.name}</p>
                      <span className="shrink-0 text-[10px] text-muted-foreground">{formatBytes(item.file.size)}</span>
                    </div>
                    <div className="mt-2 h-2 overflow-hidden rounded-full bg-muted">
                      <div className="h-full rounded-full bg-primary transition-[width] duration-200" style={{ width: `${item.progress}%` }} />
                    </div>
                    <div className="mt-1 flex items-center justify-between gap-2 text-[10px]">
                      <span className={item.status === "error" ? "text-destructive" : "text-muted-foreground"}>{item.error || statusLabel(item.status)}</span>
                      <span className="font-mono font-bold">{item.progress}%</span>
                    </div>
                  </div>
                  <div className="flex shrink-0 items-center gap-1">
                    {["queued", "preparing", "uploading"].includes(item.status) && (
                      <button type="button" onClick={() => cancelUpload(item.id)} className="rounded-lg p-1.5 text-destructive hover:bg-destructive/10" aria-label={`إلغاء رفع ${item.file.name}`}>
                        <X className="h-4 w-4" />
                      </button>
                    )}
                    {["error", "cancelled"].includes(item.status) && (
                      <button type="button" onClick={() => retryUpload(item.id)} className="rounded-lg p-1.5 text-primary hover:bg-primary/10" aria-label={`إعادة رفع ${item.file.name}`}>
                        <RefreshCw className="h-4 w-4" />
                      </button>
                    )}
                    {["done", "error", "cancelled"].includes(item.status) && (
                      <button type="button" onClick={() => setUploadQueue((current) => current.filter((entry) => entry.id !== item.id))} className="rounded-lg p-1.5 text-muted-foreground hover:bg-accent" aria-label={`إزالة ${item.file.name} من القائمة`}>
                        <Trash2 className="h-4 w-4" />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </section>
      )}
    </div>
  );
}
''', encoding="utf-8")

          route_path.write_text(route, encoding="utf-8")
          Path(".github/workflows/one-time-media-client-component-refactor.yml").unlink()

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.media.tsx src/components/admin/media-upload-panel.tsx .github/workflows/one-time-media-client-component-refactor.yml
          git commit -m "refactor(media): extract upload logic to client component to fix build boundary"
          git push origin HEAD:audit/full-platform-functional-responsive-review
