name: TikTok OAuth Focused CI

on:
  pull_request:
    paths:
      - "src/lib/tiktok.server.ts"
      - "src/lib/tiktok.functions.ts"
      - "src/components/admin/tiktok-accounts-panel.tsx"
      - "src/routes/admin.integrations.tiktok.tsx"
      - "src/routes/api.tiktok.callback.ts"
      - "src/routes/api.tiktok.device.ts"
      - "src/components/admin/admin-shell.tsx"
      - "src/integrations/supabase/types.ts"
      - "supabase/migrations/20260930183000_tiktok_accounts.sql"
      - "tests/unit/tiktok-oauth.test.ts"
      - "tests/unit/tiktok-migration-security.test.ts"
      - "src/tests/e2e/routes-audit.spec.ts"
      - ".env.example"
      - ".github/workflows/tiktok-oauth-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate route tree
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Focused unit tests
        run: |
          npx vitest run tests/unit/tiktok-oauth.test.ts tests/unit/tiktok-migration-security.test.ts

      - name: Formatting check
        run: |
          FILES="src/lib/tiktok.server.ts src/lib/tiktok.functions.ts src/components/admin/tiktok-accounts-panel.tsx src/routes/admin.integrations.tiktok.tsx src/routes/api.tiktok.callback.ts src/routes/api.tiktok.device.ts src/integrations/supabase/types.ts tests/unit/tiktok-oauth.test.ts tests/unit/tiktok-migration-security.test.ts"
          npx prettier --write $FILES
          git diff -- $FILES
          git diff --exit-code -- $FILES

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
