name: Whapi Runtime Focused CI

on:
  pull_request:
    paths:
      - "src/lib/whapi-accounts.functions.ts"
      - "src/components/admin/whapi-accounts-panel.tsx"
      - "src/routes/admin.whatsapp-accounts.tsx"
      - "tests/unit/whapi-accounts-functions.test.ts"
      - ".github/workflows/whapi-runtime-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate route tree
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Focused unit tests
        run: npx vitest run tests/unit/whapi-accounts-functions.test.ts

      - name: Formatting check
        run: npx prettier --check src/lib/whapi-accounts.functions.ts src/components/admin/whapi-accounts-panel.tsx src/routes/admin.whatsapp-accounts.tsx tests/unit/whapi-accounts-functions.test.ts

      - name: Dependency audit fix probe
        run: |
          npm audit fix --package-lock-only || true
          git diff -- package-lock.json
