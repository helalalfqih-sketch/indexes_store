name: Whapi Runtime Focused CI

on:
  pull_request:
    paths:
      - "src/lib/whapi-accounts.functions.ts"
      - "src/components/admin/whapi-accounts-panel.tsx"
      - "src/routes/admin.whatsapp-accounts.tsx"
      - "src/integrations/supabase/types.ts"
      - "supabase/migrations/20260930150000_whatsapp_runtime_accounts.sql"
      - "tests/unit/whapi-accounts-functions.test.ts"
      - ".github/workflows/whapi-runtime-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate route tree
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Focused unit tests
        run: npx vitest run tests/unit/whapi-accounts-functions.test.ts

      - name: Formatting check
        run: npx prettier --check src/lib/whapi-accounts.functions.ts src/components/admin/whapi-accounts-panel.tsx src/routes/admin.whatsapp-accounts.tsx src/integrations/supabase/types.ts tests/unit/whapi-accounts-functions.test.ts

      - name: Apply production dependency audit lockfile fixes
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          npm audit fix --package-lock-only || true
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply npm audit lockfile fixes"
          git push origin "${{ github.head_ref }}"
