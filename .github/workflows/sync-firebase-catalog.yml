name: Legacy Firebase Catalog Sync (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_sync:
        description: 'Type "SYNC_LEGACY_FIREBASE" to run the retired Firebase import manually'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: github.event.inputs.confirm_legacy_sync == 'SYNC_LEGACY_FIREBASE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke protected catalog sync
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "Missing repository secret SUPABASE_ANON_KEY"; exit 1; }
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://wtudcippyxbaobqzbmok.supabase.co/functions/v1/sync-firebase-catalog
