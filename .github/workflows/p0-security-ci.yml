name: P0 Security CI

on:
  push:
    branches:
      - fix/p0-security-critical-clean
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p0-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SITE_URL: http://127.0.0.1:4173
      VITE_PUBLIC_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_PUBLISHABLE_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate file-route types
        run: npm run build:dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Accessibility tests
        run: npm run test:accessibility

  migration-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated legacy baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f combined_migration.sql
          mkdir -p /tmp/repository-migrations
          cp -a supabase/migrations/. /tmp/repository-migrations/
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp combined_migration.sql supabase/migrations/20250719000000_legacy_foundation_for_ci.sql
          find /tmp/repository-migrations -maxdepth 1 -type f -name '[0-9]*_*.sql' -exec cp {} supabase/migrations/ \;

      - name: Start isolated local Supabase
        run: supabase start

      - name: Reset database from foundation and repository migrations
        run: supabase db reset --local

      - name: Run database regression tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
