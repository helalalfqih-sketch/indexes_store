name: P0 Security Verification Pipeline

on:
  pull_request: {}
  push:
    branches: [fix/p0-security-critical-finalization]

jobs:
  verify-security:
    name: Verify P0 Security & Quality Gates
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 1. Install Dependencies
        run: npm ci

      - name: 2. Typecheck
        run: npm run typecheck

      - name: 3. Lint Changed Files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed JavaScript or TypeScript files to lint."
            exit 0
          fi

          printf 'Linting changed file: %s\n' "${changed_files[@]}"
          npx eslint --max-warnings=0 "${changed_files[@]}"

      - name: 4. Unit Tests
        run: npm run test:unit

      - name: 5. Integration Tests
        run: npm run test:integration

      - name: 6. Security Tests
        run: npm run test:security

      - name: 7. Test Coverage
        run: npm run test:coverage

      - name: 8. Build Verification
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: 9. E2E Tests
        run: npm run test:e2e

      - name: 10. Accessibility Tests
        run: npm run test:accessibility
