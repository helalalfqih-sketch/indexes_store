name: D1 storefront
on:
  pull_request:
    paths:
      - cloudflare-storefront/**
      - package.json
      - package-lock.json
      - .github/workflows/d1-storefront.yml
  workflow_dispatch:
jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:storefront
      - run: npx eslint cloudflare-storefront
      - run: npx wrangler deploy --config cloudflare-storefront/wrangler.jsonc --dry-run
