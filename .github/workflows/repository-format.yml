name: Repository Format

on:
  push:
    branches:
      - fix/p0-security-critical-clean

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-security-critical-clean
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format TypeScript sources and tests
        run: npx prettier --write "src/**/*.{ts,tsx}" "tests/**/*.{ts,tsx}" "*.{ts,js,mjs,cjs}"

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests '*.ts' '*.js' '*.mjs' '*.cjs'
          git commit -m "style: normalize repository formatting"
          git push origin HEAD:fix/p0-security-critical-clean
