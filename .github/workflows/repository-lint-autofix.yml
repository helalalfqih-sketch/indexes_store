name: Repository Non-Any Safety Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repository-lint-autofix.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove file-level TypeScript suppression in disposable workspace
        shell: bash
        run: |
          sed -i '/^\/\/ @ts-nocheck$/d' \
            src/lib/actions/appearance.actions.ts \
            src/lib/auth.functions.ts \
            src/lib/catalog-import.functions.ts \
            src/lib/onboarding.functions.ts \
            src/lib/seed.functions.ts \
            src/lib/tenants.functions.ts

      - name: Generate TypeScript report
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck-without-nocheck.log 2>&1
          status=$?
          echo "typecheck_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: non-any-safety-probe
          path: typecheck-without-nocheck.log
          retention-days: 7
