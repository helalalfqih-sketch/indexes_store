name: Repository Safe Lint Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repository-lint-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic safe fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) {
              console.log(`No change: ${path}`);
              return;
            }
            fs.writeFileSync(path, after);
            console.log(`Updated: ${path}`);
          }

          edit('src/components/optimized-image.tsx', (text) =>
            text.replace(
              '// @ts-ignore — fetchpriority is valid HTML5 but not yet in TS types',
              '// @ts-expect-error -- fetchpriority is supported by browsers before React typings expose it',
            ),
          );

          for (const path of [
            'src/lib/ai-agent.legacy.ts',
            'src/services/ai-agent/code-patcher.engine.ts',
            'src/services/ai-agent/patch-engine.service.ts',
          ]) {
            edit(path, (text) => text.split('[\\/\\\\]').join('[/\\\\]'));
          }

          edit('src/lib/quality/runtime/console-monitor.ts', (text) =>
            text.replace(
              '    } catch {}',
              '    } catch {\n      // Console arguments may contain circular or non-serializable values.\n    }',
            ),
          );

          edit('src/lib/use-favorites.ts', (text) =>
            text
              .replace(
                '      } catch {}',
                '      } catch {\n        // localStorage may be unavailable or full; keep the in-memory state.\n      }',
              )
              .replace(
                '      } catch {}',
                '      } catch {\n        // Ignore malformed or unavailable persisted favorites.\n      }',
              ),
          );

          edit('src/lib/quality/history.ts', (text) =>
            text
              .replace(
                '      return require("fs");',
                '      // eslint-disable-next-line @typescript-eslint/no-require-imports -- development-only lazy load prevents production fs bundling\n      return require("fs");',
              )
              .replace(
                '      return require("path");',
                '      // eslint-disable-next-line @typescript-eslint/no-require-imports -- development-only lazy load prevents production path bundling\n      return require("path");',
              ),
          );

          edit('src/lib/saas/billing.service.ts', (text) =>
            text.replace(
              `  async startCheckout() {
    throw new Error("Billing not configured. TODO: connect a provider in Phase D.");
    // eslint-disable-next-line @typescript-eslint/no-unreachable
    return { url: "" };
  }`,
              `  async startCheckout(
    _input: Parameters<BillingProvider["startCheckout"]>[0],
  ): Promise<{ url: string }> {
    throw new Error("Billing not configured. TODO: connect a provider in Phase D.");
  }`,
            ),
          );

          edit('src/routes/admin.stores.$tenantId.tsx', (text) =>
            text.replace(/\bmkMut\b/g, 'useStoreMutation'),
          );
          NODE

          npx prettier --write \
            src/components/optimized-image.tsx \
            src/lib/ai-agent.legacy.ts \
            src/services/ai-agent/code-patcher.engine.ts \
            src/services/ai-agent/patch-engine.service.ts \
            src/lib/quality/runtime/console-monitor.ts \
            src/lib/use-favorites.ts \
            src/lib/quality/history.ts \
            src/lib/saas/billing.service.ts \
            'src/routes/admin.stores.$tenantId.tsx'

      - name: Generate file-route types
        run: npm run build:dev

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify targeted lint rules
        shell: bash
        run: |
          set +e
          npx eslint . --format json > lint-after-safe-fixes.json
          status=$?
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('lint-after-safe-fixes.json', 'utf8'));
          const counts = new Map();
          let errors = 0;
          let warnings = 0;
          for (const file of report) {
            errors += file.errorCount || 0;
            warnings += file.warningCount || 0;
            for (const message of file.messages || []) {
              const key = message.ruleId || 'parser';
              counts.set(key, (counts.get(key) || 0) + 1);
            }
          }
          const rules = [...counts.entries()].sort((a, b) => b[1] - a[1]);
          const summary = { errors, warnings, rules };
          fs.writeFileSync('lint-summary-after-safe-fixes.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));

          const mustBeZero = [
            'no-useless-escape',
            'no-empty',
            '@typescript-eslint/no-require-imports',
            '@typescript-eslint/no-unreachable',
            'react-hooks/rules-of-hooks',
          ];
          const failures = mustBeZero.filter((rule) => (counts.get(rule) || 0) > 0);
          if (failures.length) {
            console.error(`Targeted rules still failing: ${failures.join(', ')}`);
            process.exit(1);
          }
          NODE
          echo "full_lint_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload residual lint report
        uses: actions/upload-artifact@v4
        with:
          name: residual-lint-after-safe-fixes
          path: |
            lint-after-safe-fixes.json
            lint-summary-after-safe-fixes.json
          retention-days: 7

      - name: Commit safe fixes
        shell: bash
        run: |
          rm -f lint-after-safe-fixes.json lint-summary-after-safe-fixes.json
          if git diff --quiet; then
            echo "No changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(lint): resolve safe repository rule violations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
